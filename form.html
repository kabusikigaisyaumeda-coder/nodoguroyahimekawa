<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-FOfdP4xCRn6j/YCKL0W010rsR1HYNCzJdj49AC1+qts='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://tzmptqweehooidklvhpv.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>ご予約フォーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface2:#EBEFED; --ink:#1B2220; --muted:#5C6863; --line:#D6DDDA;
  --accent:#23467A; --accent-ink:#FFFFFF; --accent-soft:#E1E9F4; --bad:#B3372E; --bad-soft:#F7E1DE;
  --ok:#2C7A52; --ok-soft:#E0F0E7; --warn:#9C640E; --warn-soft:#F7ECD9;
  --r:10px; --shadow:0 1px 2px rgba(20,30,40,.06),0 8px 24px rgba(20,30,40,.08);
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 56px}
header.hd{text-align:center;padding:28px 0 20px}
header.hd .shop{font-family:var(--f-disp);font-size:26px;font-weight:800;letter-spacing:.04em;margin:0 0 4px}
header.hd .sub{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 18px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--accent-soft)}
.f{display:block;margin-bottom:16px}
.f>span.lb{display:block;font-size:14px;font-weight:700;margin-bottom:5px}
.f .req{color:var(--bad);font-size:12px;margin-left:6px;font-weight:700}
.f .opt{color:var(--muted);font-size:12px;margin-left:6px;font-weight:400}
.f small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.5}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],select,textarea{
  width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--ink);min-height:46px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;min-height:40px}
.chips input{accent-color:var(--accent);width:17px;height:17px}
.chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.agree{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border-radius:8px;padding:12px}
.agree input{accent-color:var(--accent);width:20px;height:20px;margin-top:2px;flex:none}
.agree span{font-size:14px}
.policy{background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
.policy b{display:block;margin-bottom:3px}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 14px;font-size:14px;margin-bottom:16px}
button.send{width:100%;font:inherit;font-size:17px;font-weight:700;padding:16px;border:0;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:56px}
button.send:disabled{opacity:.55;cursor:default}
.err{background:var(--bad-soft);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:12px 14px;font-size:14px;margin-bottom:14px;color:var(--bad);font-weight:700}
.ft{text-align:center;color:var(--muted);font-size:13px;margin-top:22px;line-height:1.8}
.ft a{color:var(--accent)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{text-align:center;padding:40px 20px}
.done .mk{width:66px;height:66px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;
  align-items:center;justify-content:center;font-size:34px;margin:0 auto 18px;font-weight:700}
.done h2{border:0;font-size:21px;font-family:var(--f-disp)}
.done .sum{text-align:left;background:var(--surface2);border-radius:8px;padding:14px 16px;margin:18px 0;font-size:14.5px}
.done .sum div{display:flex;gap:10px;padding:3px 0}
.done .sum b{flex:none;width:5.5em;color:var(--muted);font-weight:400}
.hide{display:none}
</style></head>
<body>
<div class="wrap">
<header class="hd"><p class="shop" id="hShop">　</p><p class="sub">ご予約フォーム</p></header>

<div id="load" class="card" style="text-align:center;color:var(--muted)">読み込んでいます…</div>

<form id="fm" class="hide" novalidate autocomplete="on">
  <div class="note" id="leadNote"></div>
  <div id="err" class="err hide"></div>

  <div class="card">
    <h2>ご来店について</h2>
    <label class="f"><span class="lb">ご希望日<span class="req">必須</span></span>
      <input type="date" id="date" name="date" required>
      <small id="dateHint"></small></label>
    <div class="row2">
      <label class="f"><span class="lb">ご希望時間<span class="req">必須</span></span>
        <select id="time" name="time" required></select>
        <small id="timeHint"></small></label>
      <label class="f"><span class="lb">席のご希望<span class="opt">任意</span></span>
        <select id="seat" name="seat"></select></label>
    </div>
    <div class="row2">
      <label class="f"><span class="lb">大人<span class="req">必須</span></span>
        <select id="adults" name="adults" required></select></label>
      <label class="f"><span class="lb">お子様<span class="opt">任意</span></span>
        <select id="kids" name="kids"></select>
        <small>お子様用の椅子・取り皿をご用意します</small></label>
    </div>
    <label class="f"><span class="lb">ご利用内容<span class="opt">任意</span></span>
      <select id="course" name="course"></select>
      <small>仕入れの都合がありますので、お決まりでしたらお選びください</small></label>
  </div>

  <div class="card">
    <h2>お客様情報</h2>
    <div class="row2">
      <label class="f"><span class="lb">お名前<span class="req">必須</span></span>
        <input type="text" id="name" name="name" required autocomplete="name" placeholder="例：梅田 太郎"></label>
      <label class="f"><span class="lb">ふりがな<span class="opt">任意</span></span>
        <input type="text" id="kana" name="kana" placeholder="例：うめだ たろう"></label>
    </div>
    <label class="f"><span class="lb">お電話番号<span class="req">必須</span></span>
      <input type="tel" id="tel" name="tel" required autocomplete="tel" inputmode="tel" placeholder="例：09012345678">
      <small>当日ご連絡が取れる番号をご入力ください</small></label>
    <label class="f"><span class="lb">メールアドレス<span class="opt">任意</span></span>
      <input type="email" id="mail" name="mail" autocomplete="email" inputmode="email" placeholder="例：taro@example.com">
      <small>ご予約確定のご連絡に使わせていただきます</small></label>
  </div>

  <div class="card">
    <h2>アレルギー・ご要望</h2>
    <label class="f"><span class="lb">アレルギーのある食材<span class="opt">任意</span></span>
      <div class="chips" id="alg"></div>
      <small>当てはまるものをお選びください。同じ厨房・油を使用するため、ごく微量の混入の可能性がございます</small></label>
    <label class="f"><span class="lb">その他のアレルギー・苦手なもの<span class="opt">任意</span></span>
      <input type="text" id="algNote" name="algNote" placeholder="例：青魚が苦手、甲殻類は少量なら可"></label>
    <label class="f"><span class="lb">ご要望・ご連絡事項<span class="opt">任意</span></span>
      <textarea id="note" name="note" placeholder="例：お誕生日のお祝いです／ベビーカーを使用します／駐車場を利用したい　など"></textarea></label>
  </div>

  <div class="card">
    <h2>ご予約にあたって</h2>
    <div class="policy"><b>キャンセルについて</b><span id="pCancel"></span></div>
    <div class="policy" style="border-color:var(--accent);background:var(--accent-soft)"><b>個人情報の取り扱い</b><span id="pPriv"></span></div>
    <label class="agree"><input type="checkbox" id="agree" required>
      <span>上記のキャンセルについて・個人情報の取り扱いに同意します<span class="req">必須</span></span></label>
  </div>

  <div class="hp"><label>この欄は入力しないでください<input type="text" id="hp" tabindex="-1" autocomplete="off"></label></div>
  <button type="submit" class="send" id="go">この内容で予約を申し込む</button>
  <p class="ft" id="ftTel"></p>
</form>

<div id="done" class="card done hide">
  <div class="mk">✓</div>
  <h2>お申し込みを受け付けました</h2>
  <p style="margin:0">この時点ではまだ<b>ご予約は確定しておりません</b>。<br>お店より折り返しご連絡いたしますので、少々お待ちください。</p>
  <div class="sum" id="sum"></div>
  <p class="ft" id="doneTel"></p>
</div>

<p class="ft" id="shopFt"></p>
</div>

<script>
(function () {
  'use strict';
  var SB = 'https://tzmptqweehooidklvhpv.supabase.co', KEY = 'sb_publishable_qMD1YdoblcTm0rEw525L0w__TdH8q1P';
  var $ = function (i) { return document.getElementById(i); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var fmtD = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var addDay = function (d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; };
  var DOW = ['日', '月', '火', '水', '木', '金', '土'];
  var dLong = function (s) { var p = s.split('-').map(Number); var d = new Date(p[0], p[1] - 1, p[2]); return p[0] + '年' + p[1] + '月' + p[2] + '日（' + DOW[d.getDay()] + '）'; };
  var ALG = ['えび', 'かに', 'くるみ', '小麦', 'そば', '卵', '乳', '落花生', 'カシューナッツ'];
  var CFG = null, opened = Date.now();
  var DAY = null, DAYKEY = '', INV = { t2: 0, t4: 0, za: 0 }, TURN = 120, busy = false;
  var hhmm = function (s) { var m = /(\d{1,2}):(\d{2})/.exec(String(s || '')); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
  // 人数と席の希望から、必要な卓の組み合わせ（候補）を出す
  function planList(n, pref) {
    var k = Math.max(1, Math.ceil(n / 4));
    if (n <= 2) {
      if (/座敷/.test(pref)) return [{ za: 1 }];
      if (/2名/.test(pref)) return [{ t2: 1 }, { t4: 1 }];
      if (/4名/.test(pref)) return [{ t4: 1 }];
      return [{ t2: 1 }, { t4: 1 }, { za: 1 }];
    }
    if (n <= 4) {
      if (/座敷/.test(pref)) return [{ za: 1 }];
      if (/テーブル/.test(pref)) return [{ t4: 1 }];
      return [{ t4: 1 }, { za: 1 }];
    }
    if (/座敷/.test(pref)) return [{ za: k }];
    if (/テーブル/.test(pref)) return [{ t4: k }];
    return [{ t4: k }, { za: k }];
  }
  // その時間に重なっている予約が使っている卓数
  function usedAt(mins) {
    var u = { t2: 0, t4: 0, za: 0 };
    (DAY || []).forEach(function (r) {
      var m = hhmm(r.t); if (m == null || Math.abs(m - mins) >= TURN) return;
      if (r.a) { u.t2 += Number(r.a.t2) || 0; u.t4 += Number(r.a.t4) || 0; u.za += Number(r.a.za) || 0; }
      else {
        var k = Math.max(1, Math.ceil((Number(r.n) || 1) / 4));
        if (/座敷/.test(r.s || '')) u.za += k; else if ((Number(r.n) || 1) <= 2) u.t2 += 1; else u.t4 += k;
      }
    });
    return u;
  }
  function fits(mins, n, pref) {
    var u = usedAt(mins);
    return planList(n, pref).some(function (p) {
      return (u.t2 + (p.t2 || 0)) <= INV.t2 && (u.t4 + (p.t4 || 0)) <= INV.t4 && (u.za + (p.za || 0)) <= INV.za;
    });
  }
  // 選んだ日の予約状況を取りに行く（名前・電話は返ってきません）
  function loadDay(cb) {
    var d = $('date').value;
    if (!d) { DAY = null; DAYKEY = ''; return cb && cb(); }
    if (d === DAYKEY) return cb && cb();
    busy = true; markTimes();
    fetch(SB + '/rest/v1/rpc/resv_day', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ d: d }) })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) { DAY = Array.isArray(rows) ? rows : []; DAYKEY = d; })
      .catch(function () { DAY = null; DAYKEY = ''; })
      .then(function () { busy = false; markTimes(); cb && cb(); });
  }
  // 時間のプルダウンに「満席」を付ける
  function markTimes() {
    var sel = $('time'); if (!sel) return;
    var n = Number($('adults').value || 0) + Number($('kids').value || 0);
    var pref = $('seat').value || '';
    var any = false;
    Array.prototype.forEach.call(sel.options, function (o) {
      if (!o.value) return;
      var base = o.dataset.label || o.textContent; o.dataset.label = base;
      if (busy) { o.disabled = false; o.textContent = base; any = true; return; }
      if (DAY == null || !n) { o.disabled = false; o.textContent = base; any = true; return; }
      var ok = fits(hhmm(o.value), n, pref);
      o.disabled = !ok;
      o.textContent = base + (ok ? '' : '（満席）');
      if (ok) any = true;
    });
    if (sel.selectedOptions[0] && sel.selectedOptions[0].disabled) sel.value = '';
    var hint = $('timeHint');
    if (hint) hint.textContent = busy ? '空き状況を確認しています…'
      : DAY == null ? ''
        : !n ? '人数をお選びいただくと、満席の時間が分かります'
          : any ? '「満席」と出ている時間はお選びいただけません'
            : 'この日はご希望の人数でのお席が満席です。別の日をお選びいただくか、お電話でご相談ください。';
  }

  function opt(sel, list, blank) {
    sel.innerHTML = (blank ? '<option value="">' + esc(blank) + '</option>' : '') +
      list.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('');
  }
  function split(s) { return String(s || '').split(/[,\n]/).map(function (x) { return x.trim(); }).filter(Boolean); }

  function build(c) {
    CFG = c;
    document.title = (c.shop || 'お店') + '　ご予約フォーム';
    $('hShop').textContent = c.shop || '';
    var lead = Math.max(0, Number(c.leadDays) || 0);
    var min = fmtD(addDay(new Date(), lead));
    var max = fmtD(addDay(new Date(), 31 * (Number(c.months) || 3)));
    var dt = $('date'); dt.min = min; dt.max = max;
    $('dateHint').textContent = dLong(min) + ' 以降のご予約を承っています';
    $('leadNote').innerHTML = '<b>このフォームは仮のお申し込みです。</b>お店からご連絡した時点でご予約の確定となります。'
      + (lead > 0 ? '<br>当日・' + (lead > 1 ? lead + '日以内' : '本日') + 'のご予約は、恐れ入りますがお電話でお願いいたします。' : '');

    INV = { t2: Number(c.t2) || 0, t4: Number(c.t4) || 0, za: Number(c.za) || 0 };
    TURN = Math.max(30, Number(c.turn) || 120);
    var times = split(c.lunch).map(function (t) { return 'ランチ ' + t; }).concat(split(c.dinner).map(function (t) { return 'ディナー ' + t; }));
    opt($('time'), times, '選んでください');
    opt($('seat'), split(c.seats).length ? split(c.seats) : ['おまかせ'], '');
    var mx = Math.max(1, Number(c.maxPeople) || 8), ad = [], kd = ['0'];
    for (var i = 1; i <= mx; i++) ad.push(String(i));
    for (var j = 1; j <= mx; j++) kd.push(String(j));
    opt($('adults'), ad, '選んでください'); opt($('kids'), kd, '');
    $('adults').insertAdjacentHTML('afterend', '<small>' + mx + '名さまを超えるご予約は、お手数ですがお電話でご相談ください</small>');
    opt($('course'), split(c.courses), 'お決まりでしたらお選びください');
    $('alg').innerHTML = ALG.map(function (a) { return '<label><input type="checkbox" value="' + esc(a) + '">' + esc(a) + '</label>'; }).join('');
    $('pCancel').textContent = c.cancel || '';
    $('pPriv').textContent = c.privacy || '';
    var telHtml = c.tel ? 'お電話でのご予約・ご相談は <a href="tel:' + esc(c.tel.replace(/[^0-9+]/g, '')) + '">' + esc(c.tel) + '</a>' : '';
    $('ftTel').innerHTML = telHtml; $('doneTel').innerHTML = telHtml;
    $('shopFt').innerHTML = esc(c.shop || '') + (c.addr ? '<br>' + esc(c.addr) : '') + (c.note ? '<br>' + esc(c.note) : '');
    $('date').addEventListener('change', function () { loadDay(); });
    $('adults').addEventListener('change', markTimes);
    $('kids').addEventListener('change', markTimes);
    $('seat').addEventListener('change', markTimes);
    $('load').classList.add('hide'); $('fm').classList.remove('hide');
  }

  function fail(msg) { $('load').innerHTML = '<div class="err">' + esc(msg) + '</div>'; }

  fetch(SB + '/rest/v1/public_info?id=eq.form&select=data', { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('read')); })
    .then(function (rows) {
      var c = rows && rows[0] && rows[0].data;
      if (!c) return fail('ただいま予約フォームをご利用いただけません。お手数ですがお電話でご連絡ください。');
      if (c.on === false) return fail('ただいまWebでのご予約受付を停止しております。お手数ですがお電話でご連絡ください。');
      build(c);
    })
    .catch(function () { fail('通信できませんでした。電波のよい場所で再度お試しいただくか、お電話でご連絡ください。'); });

  function showErr(m) { var e = $('err'); e.textContent = m; e.classList.remove('hide'); e.scrollIntoView({ block: 'center', behavior: 'smooth' }); }

  $('fm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('err').classList.add('hide');
    if ($('hp').value) return;
    if (Date.now() - opened < 3000) return showErr('送信が早すぎます。入力内容をご確認のうえ、もう一度お試しください。');
    var v = {
      date: $('date').value, time: $('time').value, seat: $('seat').value,
      adults: $('adults').value, kids: $('kids').value || '0', course: $('course').value,
      name: $('name').value.trim(), kana: $('kana').value.trim(), tel: $('tel').value.trim(),
      mail: $('mail').value.trim(), algNote: $('algNote').value.trim(), note: $('note').value.trim(),
      alg: Array.prototype.slice.call($('alg').querySelectorAll('input:checked')).map(function (i) { return i.value; }),
      agreedAt: new Date().toISOString(), src: 'web'
    };
    if (!v.date) return showErr('ご希望日をお選びください。');
    if (v.date < $('date').min) return showErr('申し訳ございません。' + dLong($('date').min) + ' 以降の日付をお選びください。');
    if (v.date > $('date').max) return showErr('申し訳ございません。' + dLong($('date').max) + ' までのご予約を承っております。');
    if (!v.time) return showErr('ご希望時間をお選びください。');
    if (!v.adults) return showErr('大人の人数をお選びください。');
    var mxp = Math.max(1, Number(CFG.maxPeople) || 8);
    if (Number(v.adults) + Number(v.kids) > mxp) return showErr('恐れ入りますが、Webでのご予約は合計' + mxp + '名さままでです。それ以上は直接お電話でご相談ください。');
    if (!v.name) return showErr('お名前をご入力ください。');
    if (!/^[0-9+\-()\s]{10,}$/.test(v.tel)) return showErr('お電話番号をご確認ください（市外局番からご入力ください）。');
    if (v.mail && !/^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(v.mail)) return showErr('メールアドレスをご確認ください。');
    if (!$('agree').checked) return showErr('キャンセルについて・個人情報の取り扱いへのご同意が必要です。');

    if (DAY != null && !fits(hhmm(v.time), Number(v.adults) + Number(v.kids), v.seat)) {
      markTimes();
      return showErr('あいにくこのお時間は満席です。別のお時間をお選びいただくか、お電話でご相談ください。');
    }
    var b = $('go'); b.disabled = true; b.textContent = '送信しています…';
    fetch(SB + '/rest/v1/rpc/book_resv', {
      method: 'POST',
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ payload: v })
    }).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) { throw new Error(j.message || String(r.status)); });
      var rows = [['ご来店日', dLong(v.date)], ['お時間', v.time], ['人数', '大人 ' + v.adults + '名' + (Number(v.kids) ? '／お子様 ' + v.kids + '名' : '')],
        ['お名前', v.name + ' 様'], ['お電話', v.tel]];
      if (v.course) rows.push(['ご利用', v.course]);
      if (v.alg.length || v.algNote) rows.push(['アレルギー', v.alg.concat(v.algNote ? [v.algNote] : []).join('、')]);
      $('sum').innerHTML = rows.map(function (r2) { return '<div><b>' + esc(r2[0]) + '</b><span>' + esc(r2[1]) + '</span></div>'; }).join('');
      $('fm').classList.add('hide'); $('done').classList.remove('hide');
      window.scrollTo(0, 0);
    }).catch(function (e) {
      b.disabled = false; b.textContent = 'この内容で予約を申し込む';
      var m = String(e.message || '');
      DAYKEY = ''; loadDay();
      showErr(/満席|受付停止|混み合|入力内容|入力が長|必須/.test(m) ? m
        : '送信できませんでした。お手数ですが、もう一度お試しいただくかお電話でご連絡ください。');
    });
  });
})();
</script>
</body></html>
