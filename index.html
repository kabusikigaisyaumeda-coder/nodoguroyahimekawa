<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Q78e5xZpzo/iGBSLFVJEeuPAtpZuY3IKugXd7nr9aQ8='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://hvbplhfmmjkzsqqflrjy.supabase.co; img-src 'self' data: blob: https://hvbplhfmmjkzsqqflrjy.supabase.co; object-src https://hvbplhfmmjkzsqqflrjy.supabase.co; base-uri 'none'; form-action 'none'; manifest-src 'self'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="のどぐろ家姫川"><meta name="theme-color" content="#23467A"></head><body>
<title>のどぐろ家姫川</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface2:#EBEFED; --ink:#1B2220; --muted:#5C6863; --line:#D6DDDA;
  --accent:#23467A; --accent-ink:#FFFFFF; --accent-soft:#E1E9F4;
  --shu:#BF3F2B; --ok:#2C7A52; --ok-soft:#E0F0E7; --warn:#9C640E; --warn-soft:#F7ECD9; --bad:#B3372E; --bad-soft:#F7E1DE;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 8px 24px rgba(20,30,40,.08);
  --r:10px;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111514; --surface:#191F1D; --surface2:#212826; --ink:#E3E8E5; --muted:#97A29D; --line:#2C3431;
    --accent:#8AABE0; --accent-ink:#0D1829; --accent-soft:#1D2A3F;
    --shu:#E57B64; --ok:#6CC499; --ok-soft:#18342A; --warn:#E3AA4F; --warn-soft:#3A2D16; --bad:#EF7E73; --bad-soft:#3E1F1C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#191F1D; --surface2:#212826; --ink:#E3E8E5; --muted:#97A29D; --line:#2C3431;
  --accent:#8AABE0; --accent-ink:#0D1829; --accent-soft:#1D2A3F;
  --shu:#E57B64; --ok:#6CC499; --ok-soft:#18342A; --warn:#E3AA4F; --warn-soft:#3A2D16; --bad:#EF7E73; --bad-soft:#3E1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand .seal{width:34px;height:34px;border-radius:50%;border:2px solid var(--shu);color:var(--shu);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:13px;line-height:1;letter-spacing:-.02em;flex:none}
.brand b{font-family:var(--f-disp);font-weight:800;font-size:19px;letter-spacing:.06em;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.nav-g{padding:8px 10px 4px}
.nav-g h4{margin:6px 8px 4px;font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.nav-g button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14.5px}
.nav-g button:hover{background:var(--surface2)}
.nav-g button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav-g button .k{margin-left:auto;font-size:11px;color:var(--muted)}
.main{min-width:0;padding-inline:28px;padding-block:0 60px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:18px 14px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);margin-bottom:20px}
.top h1{font-family:var(--f-disp);font-weight:800;font-size:24px;margin:0;letter-spacing:.04em;text-wrap:balance}
.top .sp{flex:1}
.btn.menu-btn{display:none}
.mon{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.mon button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:15px}
.mon button:hover{background:var(--surface2)}
.mon span{padding:0 6px;font-weight:700;min-width:7.5em;text-align:center}
.who{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.who select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sync{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.on{color:var(--ok);border-color:currentColor}
.sync.local{color:var(--warn);border-color:currentColor}

/* ---- building blocks ---- */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card>h3,.sec>h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card>h3 .sp,.sec>h3 .sp{flex:1}
.sec{margin-block:0 26px}
.sec>h3{font-family:var(--f-disp);font-size:17px;font-weight:800;letter-spacing:.03em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.btn.big{min-height:52px;font-size:16px;padding:8px 18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.stat{background:var(--surface);padding:12px 16px}
.stat .l{font-size:12px;color:var(--muted);letter-spacing:.05em}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .s{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface2);letter-spacing:.04em;position:sticky;top:0}
.tbl td.n,.tbl th.n{text-align:right}
.tbl td.wrap{white-space:normal;min-width:12em}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--surface2)}
.tbl tfoot td{font-weight:700;background:var(--surface2);border-bottom:0}
.tbl tr.dim td{color:var(--muted)}
.tbl tr.sun td:first-child{color:var(--shu)}
.tbl tr.sat td:first-child{color:var(--accent)}
.tbl input{width:100%;min-width:4.5em;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:right}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}
.field-inline{display:inline-flex;align-items:center;gap:6px}
.field-inline input,.field-inline select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:38px}
.note-box{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13.5px;margin-bottom:16px}
.note-box.warn{border-color:var(--warn);background:var(--warn-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.kv .tot{border-top:1px solid var(--line);padding-top:6px}

/* home quick */
.today{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:16px}
.today .d{font-family:var(--f-disp);font-weight:800;font-size:30px;letter-spacing:.03em}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.quick button:hover{border-color:var(--accent)}
.quick b{font-size:16px}
.quick span{font-size:12px;color:var(--muted)}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.alert .sp{flex:1}

/* timecard */
.punch{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:24px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.pc .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.pc .nm .sp{flex:1}
.pc .tm{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.6em}
.pc .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc .acts .btn{min-height:46px}
.pc.working{border-color:var(--ok)}
.pc.onbreak{border-color:var(--warn)}

/* register */
.denom{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center}
.denom label{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.denom input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:right;font-size:16px;width:100%;min-height:42px}
.denom .sub{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;min-width:6.5em}
.stamp{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;border:2.5px solid var(--shu);color:var(--shu);font-family:var(--f-disp);font-weight:800;font-size:14px;transform:rotate(-8deg);line-height:1.15;text-align:center}

/* checklist */
.chk{display:grid;gap:6px}
.chk label{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.chk label.done{background:var(--ok-soft);border-color:transparent}
.chk label.done span.t{text-decoration:line-through;color:var(--muted)}
.chk .by{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.prog{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--ok)}

/* shift grid */
.shift td,.shift th{padding:6px 6px;text-align:center;font-size:12.5px}
.shift td.cell{cursor:pointer;min-width:58px}
.shift td.cell:hover{background:var(--surface2)}
.shift td.cell b{display:block;font-size:12.5px;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:2px 3px}
.shift th.sun{color:var(--shu)} .shift th.sat{color:var(--accent)}
.shift td.nm{text-align:left;font-weight:700;position:sticky;left:0;background:var(--surface);z-index:1}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,16,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;border:1px solid var(--line)}
.modal.wide{max-width:860px}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:17px;font-family:var(--f-disp);font-weight:800;flex:1}
.modal .body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .sp{flex:1}
.f{display:grid;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f>span{font-size:12.5px;color:var(--muted);font-weight:700}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
.f textarea{min-height:80px;resize:vertical}
.f .ck{display:flex;align-items:center;gap:8px;min-height:40px}
.f .ck input{width:20px;height:20px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer}
.chips input{accent-color:var(--accent)}
.chips label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.lines{grid-column:1/-1;display:grid;gap:6px}
.lines .ln{display:grid;grid-template-columns:minmax(0,1fr) 90px 60px 90px 34px;gap:6px;align-items:center}
.lines .ln input,.lines .ln select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);min-height:36px;width:100%}
.lines .ln .n{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.receipt-img{max-width:100%;border-radius:8px;border:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:80;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* menu preview */
.menu-wrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
.menu-paper{aspect-ratio:210/297;max-width:100%;width:100%;overflow:hidden;box-shadow:var(--shadow);border-radius:4px}
.allg td,.allg th{text-align:center;padding:5px 6px;font-size:12.5px}
.allg th.v{writing-mode:vertical-rl;text-orientation:upright;height:6.5em;padding:6px 3px;letter-spacing:.05em}
.allg td.nm{text-align:left;font-weight:700;position:sticky;left:0;background:var(--surface)}
.allg .m{color:var(--shu);font-weight:700}
.allg th.req{background:var(--bad-soft);color:var(--bad)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:60;transform:translateX(-105%);transition:transform .2s;visibility:hidden}
  .app.open .side{transform:none;visibility:visible;box-shadow:var(--shadow)}
  .app.open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  .btn.menu-btn{display:inline-flex}
  .main{padding-inline:16px}
  .top h1{font-size:20px}
  .menu-wrap{grid-template-columns:1fr}
}
@media (max-width:560px){
  .modal .body{grid-template-columns:1fr}
  .lines .ln{grid-template-columns:minmax(0,1fr) 70px 70px 30px}
  .lines .ln .u{display:none}
  .today .d{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .side,.top,.toolbar,.no-print{display:none!important}
  .app{display:block}
  .main{padding:0}
  body{background:#fff}
}
</style>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<div id="modal-root"></div>
<script>
/* ===================== 基本ユーティリティ ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[,¥￥\s円]/g, '')); return isFinite(n) ? n : 0; };
const yen = n => { n = Math.round(n || 0); return (n < 0 ? '−' : '') + '¥' + Math.abs(n).toLocaleString('ja-JP'); };
const int = n => Math.round(n || 0).toLocaleString('ja-JP');
const pct = n => isFinite(n) ? (n * 100).toFixed(1) + '%' : '—';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const fmtD = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => fmtD(new Date());
const ymOf = ds => String(ds || '').slice(0, 7);
const curYM = () => today().slice(0, 7);
const addMonth = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const ymLabel = ym => { const [y, m] = ym.split('-'); return `${y}年${Number(m)}月`; };
const monthDays = ym => { const [y, m] = ym.split('-').map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({ length: n }, (_, i) => `${ym}-${pad(i + 1)}`); };
const lastDay = ym => monthDays(ym).slice(-1)[0];
const DOW = ['日', '月', '火', '水', '木', '金', '土'];
const dowN = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
const dLabel = ds => ds ? `${Number(ds.slice(5, 7))}/${Number(ds.slice(8, 10))}(${DOW[dowN(ds)]})` : '';
const dLong = ds => `${ds.slice(0, 4)}年${Number(ds.slice(5, 7))}月${Number(ds.slice(8, 10))}日（${DOW[dowN(ds)]}）`;
const addDay = (ds, n) => { const [y, m, d] = ds.split('-').map(Number); return fmtD(new Date(y, m - 1, d + n)); };
const hm2m = s => { if (s === '' || s == null) return null; const [h, m] = String(s).split(':').map(Number); return isFinite(h) ? h * 60 + (m || 0) : null; };
const m2hm = m => { if (m == null) return ''; const nd = m >= 1440; const mm = ((m % 1440) + 1440) % 1440; return (nd ? '翌' : '') + Math.floor(mm / 60) + ':' + pad(mm % 60); };
const m2in = m => { if (m == null) return ''; const mm = ((m % 1440) + 1440) % 1440; return pad(Math.floor(mm / 60)) + ':' + pad(mm % 60); };
const hrs = m => (Math.round((m || 0) / 6) / 10).toFixed(1);

const Store = {
  mode: 'sb', data: {}, subs: {}, onChange: null, lastTs: null, pollT: null,
  async init() { this.lastTs = new Date(Date.now() - 120000).toISOString(); this.startPoll(); },
  emit() { this.onChange && this.onChange(); },
  apply(key, rows) {
    const d = this.data[key] || (this.data[key] = { exists: true, r: {}, ready: true });
    const r = { ...d.r };
    for (const row of rows) { if (row.deleted || row.data == null) delete r[row.id]; else r[row.id] = row.data; if (!this.lastTs || row.updated_at > this.lastTs) this.lastTs = row.updated_at; }
    this.data[key] = { exists: true, r, ready: true };
  },
  async load(key) {
    try {
      const rows = await SB.rows('select=id,data,deleted,updated_at&bucket=eq.' + encodeURIComponent(key));
      this.data[key] = { exists: true, r: {}, ready: true }; this.apply(key, rows); this.emit();
    } catch (e) { this.data[key] = { ...(this.data[key] || { r: {} }), ready: true, error: e.message }; toast('読み込みに失敗しました：' + e.message); this.emit(); }
  },
  ensure(key) {
    if (this.subs[key]) return;
    this.subs[key] = true;
    if (!this.data[key] || !this.data[key].ready || this.data[key].once) { if (!this.data[key]) this.data[key] = { exists: true, r: {}, ready: false }; this.load(key); }
  },
  release(key) { delete this.subs[key]; },
  ready(key) { this.ensure(key); return !!(this.data[key] && this.data[key].ready); },
  list(key) { this.ensure(key); return this.listRaw(key); },
  get(key, id) { this.ensure(key); const r = this.data[key] && this.data[key].r; return r && r[id] ? { ...r[id], id } : null; },
  async fetch(key) {
    if (this.data[key] && this.data[key].ready) return this.listRaw(key);
    try { const rows = await SB.rows('select=id,data,deleted,updated_at&bucket=eq.' + encodeURIComponent(key)); this.data[key] = { exists: true, r: {}, ready: true, once: !this.subs[key] }; this.apply(key, rows); if (!this.subs[key]) this.data[key].once = true; }
    catch (e) { return []; }
    return this.listRaw(key);
  },
  listRaw(key) { const r = (this.data[key] && this.data[key].r) || {}; return Object.keys(r).filter(k => r[k]).map(k => ({ ...r[k], id: k })); },
  async poll() {
    const keys = Object.keys(this.subs).filter(k => this.data[k] && this.data[k].ready);
    if (!keys.length || !this.lastTs || !SB.sess) return;
    const since = new Date(new Date(this.lastTs).getTime() - 5000).toISOString();
    try {
      const rows = await SB.rows('select=bucket,id,data,deleted,updated_at&updated_at=gt.' + encodeURIComponent(since) + '&bucket=' + encodeURIComponent(SB.inList(keys)));
      if (!rows.length) return;
      const by = groupBy(rows, x => x.bucket); let changed = false;
      for (const k in by) { const before = JSON.stringify(this.data[k].r); this.apply(k, by[k]); if (JSON.stringify(this.data[k].r) !== before) changed = true; }
      if (changed) this.emit();
    } catch (e) { }
  },
  startPoll() {
    clearInterval(this.pollT); this.pollT = setInterval(() => { if (!document.hidden) this.poll(); }, 12000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.poll(); });
  },
  async put(key, id, rec) {
    const clean = rec ? clone(rec) : null;
    if (clean) delete clean.id;
    this.ensure(key);
    const d = this.data[key];
    d.r = { ...d.r, [id]: clean }; if (!clean) delete d.r[id];
    this.emit();
    try {
      const res = await SB.req('/rest/v1/records?on_conflict=bucket,id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=representation' }, body: [{ bucket: key, id, data: clean, deleted: !clean }] });
      if (res && res[0] && (!this.lastTs || res[0].updated_at > this.lastTs)) this.lastTs = res[0].updated_at;
      return true;
    } catch (e) { toast('保存できませんでした：' + e.message); this.load(key); return false; }
  },
  async allKeys() {
    const rows = await SB.rows('select=bucket,id,data,deleted&deleted=eq.false');
    const by = {}; for (const r of rows) (by[r.bucket] = by[r.bucket] || {})[r.id] = r.data;
    return Object.keys(by).map(k => ({ key: k, r: by[k] }));
  },
  async restore(key, r) {
    const body = Object.keys(r).filter(id => r[id]).map(id => ({ bucket: key, id, data: r[id], deleted: false }));
    for (let i = 0; i < body.length; i += 500) await SB.req('/rest/v1/records?on_conflict=bucket,id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates' }, body: body.slice(i, i + 500) });
    delete this.data[key]; if (this.subs[key]) { delete this.subs[key]; this.ensure(key); }
  }
};

function readForm(fields) {
  const fm = $('#mform'); const out = {};
  for (const f of fields) {
    if (f.type === 'chips') { out[f.k] = $$(`input[name="${f.k}"]:checked`, fm).map(i => i.value); continue; }
    const el = fm.querySelector(`[name="${f.k}"]`); if (!el) continue;
    if (f.type === 'check') out[f.k] = el.checked;
    else if (f.type === 'money' || f.type === 'num') out[f.k] = el.value === '' ? '' : num(el.value);
    else if (f.type === 'time') out[f.k] = hm2m(el.value);
    else if (f.type === 'textarea' && f.lines) out[f.k] = el.value.split('\n').map(s => s.trim()).filter(Boolean);
    else if (f.type === 'receipt') out[f.k] = el.files && el.files[0] ? el.files[0] : undefined;
    else out[f.k] = el.value.trim();
  }
  return out;
}
async function uploadReceipts(fields, v, old) {
  for (const f of fields) {
    if (f.type !== 'receipt') continue;
    const file = v[f.k];

      try { toast('証憑をアップロード中…'); const a = await S.assets.upload(file); v[f.k] = { id: a.id, url: a.url, type: a.contentType || file.type || '' }; }
      catch (e) { toast('証憑をアップロードできませんでした（' + (e.code || 'error') + '）'); v[f.k] = old ? old[f.k] : undefined; }
    } else v[f.k] = old ? old[f.k] : undefined;
    if (v[f.k] === undefined) delete v[f.k];
  }
  return v;
}
async function submitModal(ev) {
  ev.preventDefault();
  if (!modalState) return;
  const { fields, value, onSave } = modalState;
  const v = readForm(fields);
  for (const f of fields) if (f.req && (v[f.k] === '' || v[f.k] == null)) { toast(`「${f.label}」を入力してください`); const el = $('#f_' + f.k); el && el.focus(); return; }

  closeModal();
}

// 勤怠1件：実働・深夜（22-5時）・休憩
function timeCalc(t, openNow) {
  if (!t || t.in == null) return null;
  let out = t.out;
  const isToday = t.date === today();
  if (out == null) { if (!openNow || !isToday) return { open: true, work: 0, night: 0, brk: 0, ot: 0 }; out = Math.max(nowMin(), t.in); }
  if (out < t.in) out += 1440;
  let segs = [[t.in, out]]; let brk = 0;
  for (const b of (t.breaks || [])) {
    if (b.s == null) continue;
    let s = b.s < t.in ? b.s + 1440 : b.s;
    let e = b.e == null ? (openNow && isToday ? Math.max(nowMin(), s) : s) : b.e;
    if (e < s) e += 1440;
    brk += e - s;
    const ns = [];
    for (const [a, z] of segs) { if (e <= a || s >= z) { ns.push([a, z]); continue; } if (s > a) ns.push([a, s]); if (e < z) ns.push([e, z]); }
    segs = ns;
  }
  const work = sum(segs, ([a, z]) => z - a);
  const NIGHT = [[0, 300], [1320, 1740], [2760, 3180]];
  let night = 0;
  for (const [a, z] of segs) for (const [na, nz] of NIGHT) night += Math.max(0, Math.min(z, nz) - Math.max(a, na));
  return { open: t.out == null, work, night, brk, ot: Math.max(0, work - 480) };
}
// 月の勤怠集計（スタッフ別）：法定時間外は 1日8h超 ＋ 週の法定時間超（週は日曜始まり・月内で計算）
function monthTime(ym, recs) {
  const set = SET();
  const out = {};
  const by = groupBy(recs.filter(t => t.in != null), t => t.staff);
  for (const sid in by) {
    const list = by[sid].sort(byDate);
    let days = new Set(), work = 0, night = 0, dailyOT = 0, weekOT = 0; const weeks = {};
    for (const t of list) {
      const c = timeCalc(t); if (!c || c.open) continue;
      days.add(t.date); work += c.work; night += c.night; dailyOT += c.ot;
      const wk = addDay(t.date, -dowN(t.date));
      weeks[wk] = (weeks[wk] || 0) + Math.min(c.work, 480);
    }
    for (const wk in weeks) weekOT += Math.max(0, weeks[wk] - set.weekLimit * 60);
    out[sid] = { days: days.size, work, night, ot: dailyOT + weekOT, dailyOT, weekOT };
  }
  return out;
}
// 給与計算
function payCalc(staff, tm, adj) {
  tm = tm || { days: 0, work: 0, night: 0, ot: 0 }; adj = adj || {};
  const set = SET();
  const hourly = staff.payType === 'month' ? num(staff.rate) / (num(staff.monthlyHours) || num(set.monthlyHours) || 173) : num(staff.rate);
  const base = staff.payType === 'month' ? num(staff.rate) : Math.round(num(staff.rate) * tm.work / 60);
  const ot1 = Math.min(tm.ot, 3600), ot2 = Math.max(0, tm.ot - 3600); // 月60時間を超える部分は50%割増
  const otPrem = Math.round(hourly * ((staff.payType === 'month' ? 1.25 : 0.25) * ot1 + (staff.payType === 'month' ? 1.5 : 0.5) * ot2) / 60);
  const nightPrem = Math.round(hourly * 0.25 * tm.night / 60);
  const commute = staff.commuteType === 'month' ? num(staff.commute) : Math.round(num(staff.commute) * tm.days);
  const allowance = num(adj.allowance);
  const gross = base + otPrem + nightPrem + commute + allowance;
  const ded = { health: num(adj.health), pension: num(adj.pension), emp: num(adj.emp), tax: num(adj.tax), resident: num(adj.resident), other: num(adj.other) };
  const dedTotal = sum(Object.values(ded));
  return { hourly, base, otPrem, nightPrem, commute, allowance, gross, ded, dedTotal, net: gross - dedTotal };
}

function recipeCost(r) {
  const y = num(r.yield) || 1;
  let c = 0; const allg = new Set(r.allergensExtra || []);
  for (const ln of (r.lines || [])) { const it = itemById(ln.item); if (!it) continue; c += num(it.price) * num(ln.qty); (it.allergens || []).forEach(a => allg.add(a)); }
  const cost = c / y + num(r.extra);
  const net = num(r.price) / (r.takeout ? 1.08 : 1.1);
  return { cost, rate: net > 0 ? cost / net : NaN, allergens: ALLERGENS.filter(a => allg.has(a)) };
}

function cashLines(ym, src) {
  src = src || { cash: L('cash', ym), exp: L('exp', ym), purch: L('purch', ym) };
  const lines = [];
  for (const c of src.cash) lines.push({ date: c.date, desc: c.desc, account: c.kind === '入金' ? (c.counter || '事業主借') : c.account, inAmt: c.kind === '入金' ? num(c.amount) : 0, outAmt: c.kind === '入金' ? 0 : num(c.amount), src: 'cash', rec: c });
  for (const e of src.exp.filter(e => e.pay === '小口現金')) lines.push({ date: e.date, desc: (e.payee || '') + (e.note ? ' ' + e.note : ''), account: e.account, inAmt: 0, outAmt: num(e.amount), src: 'exp', rec: e });
  for (const p of src.purch.filter(p => p.pay === '小口現金')) lines.push({ date: p.date, desc: supName(p.supplier) + (p.desc ? ' ' + p.desc : ''), account: '仕入高', inAmt: 0, outAmt: num(p.a8) + num(p.a10), src: 'purch', rec: p });
  return lines.sort(byDate);
}
// 小口現金の前月繰越（開始月から積み上げ）
async function cashCarry(ym) {
  const set = SET();
  const start = set.cashStartMonth || ym;
  if (ym <= start) return num(set.cashStart);
  let bal = num(set.cashStart);
  for (let m = start; m < ym; m = addMonth(m, 1)) {
    const [cash, exp, purch] = await Promise.all(['cash', 'exp', 'purch'].map(n => Store.fetch(MK(n, m))));
    const ls = cashLines(m, { cash, exp, purch });
    bal += sum(ls, l => l.inAmt) - sum(ls, l => l.outAmt);
  }
  return bal;
}
// 減価償却（年ごと）
function deprSchedule(a, year) {
  const cost = num(a.cost); const ratio = (a.ratio === '' || a.ratio == null ? 100 : num(a.ratio)) / 100;
  const y0 = Number(String(a.date || '').slice(0, 4)); const m0 = Number(String(a.date || '').slice(5, 7));
  if (!y0 || !cost) return { open: 0, dep: 0, close: 0, biz: 0 };
  if (year < y0) return { open: 0, dep: 0, close: 0, biz: 0 };
  let book = cost; let dep = 0, open = cost;
  for (let y = y0; y <= year; y++) {
    open = book; let d = 0;
    if (a.method === '少額（一括経費）') d = y === y0 ? book : 0;
    else if (a.method === '一括償却（3年）') d = y - y0 < 3 ? (y - y0 === 2 ? book : Math.floor(cost / 3)) : 0;
    else {
      const rate = SL_RATE[num(a.life)] || (num(a.life) ? Math.ceil(1000 / num(a.life)) / 1000 : 0);
      const months = y === y0 ? 13 - m0 : 12;
      d = Math.floor(cost * rate * months / 12);
      if (book - d < 1) d = book - 1;
    }
    d = Math.max(0, d); book -= d; dep = d;
  }
  return { open, dep, close: book, biz: Math.round(dep * ratio) };
}

  return { counted, expect, diff: r.counts ? counted - expect : 0, deposit: counted - num(r.nextFloat ?? r.float) };
}

A.cashAdd = (el) => cashCrud.add({ date: today(), kind: el && el.dataset && el.dataset.k === 'in' ? '入金' : '出金' });
P.cash = {
  month: true,
  keys: () => [MK('cash', S.month), MK('exp', S.month), MK('purch', S.month)],
  render() {
    const ck = 'carry_' + S.month;
    if (S.cache[ck] === undefined) { S.cache[ck] = null; cashCarry(S.month).then(v => { S.cache[ck] = v; render(); }); }
    const carry = S.cache[ck];
    const lines = cashLines(S.month); let bal = num(carry);
    const rows = lines.map(l => { bal += l.inAmt - l.outAmt; return `<tr class="click" data-act="cashEdit" data-src="${esc(l.src)}" data-id="${esc(l.rec.id)}"><td>${dLabel(l.date)}</td><td class="wrap">${esc(l.desc || '')}${l.src !== 'cash' ? ` <span class="pill">${l.src === 'exp' ? '経費帳' : '仕入帳'}から</span>` : ''}</td><td>${esc(l.account || '')}</td><td class="n">${l.inAmt ? yen(l.inAmt) : ''}</td><td class="n">${l.outAmt ? yen(l.outAmt) : ''}</td><td class="n"><b class="${bal < 0 ? 'pill bad' : ''}">${yen(bal)}</b></td><td>${receiptLink(l.rec)}</td></tr>`; }).join('');
    const tin = sum(lines, l => l.inAmt), tout = sum(lines, l => l.outAmt);
    return `<div class="stats">${stat('前月繰越', carry == null ? '計算中…' : yen(carry))}${stat('入金', yen(tin))}${stat('出金', yen(tout))}${stat('現在残高', carry == null ? '…' : yen(num(carry) + tin - tout), '手元の小口現金と一致するか確認')}</div>
    <div class="toolbar"><button class="btn primary" data-act="cashAdd">＋ 出金（支払）</button><button class="btn" data-act="cashAdd" data-k="in">＋ 入金（補充）</button><span class="sp"></span><button class="btn" data-act="cashCSV">出納帳CSV</button></div>
    ${lines.length ? `<div class="tw"><table class="tbl"><thead><tr><th>日付</th><th>摘要</th><th>勘定科目</th><th class="n">入金</th><th class="n">出金</th><th class="n">残高</th><th></th></tr></thead><tbody><tr class="dim"><td>${dLabel(S.month + '-01')}</td><td>前月より繰越</td><td></td><td></td><td></td><td class="n">${yen(carry)}</td><td></td></tr>${rows}</tbody><tfoot><tr><td colspan="3">合計</td><td class="n">${yen(tin)}</td><td class="n">${yen(tout)}</td><td class="n">${carry == null ? '' : yen(num(carry) + tin - tout)}</td><td></td></tr></tfoot></table></div>`
        : emptyBox(ymLabel(S.month) + 'の記帳はまだありません', '買い出しや備品の購入など、小口現金から支払ったものを記帳します', '<button class="btn primary" data-act="cashAdd">＋ 出金（支払）</button>')}

  }
};
A.cashEdit = el => {
  const src = el.dataset.src, id = el.dataset.id;
  if (src === 'cash') cashCrud.edit(Store.get(MK('cash', S.month), id));
  else if (src === 'exp') expCrud.edit(Store.get(MK('exp', S.month), id));
  else purchCrud.edit(Store.get(MK('purch', S.month), id));
};
A.cashCSV = async () => {
  const carry = await cashCarry(S.month); let bal = carry;
  const rows = cashLines(S.month).map(l => { bal += l.inAmt - l.outAmt; return [l.date, l.desc, l.account, l.inAmt || '', l.outAmt || '', bal]; });

  { k: 'tax', label: '税率', type: 'select', opts: [{ v: 10, l: '10%' }, { v: 8, l: '8%（軽減）' }, { v: 0, l: '対象外・非課税' }], def: 10, hint: '家賃（店舗）は10%、保険料・税金は対象外' },
  { k: 'pay', label: '支払方法', type: 'select', opts: ['カード', '振込/口座', '事業主借', '小口現金'], def: '振込/口座', hint: '個人の財布やカードで払ったら「事業主借」' },

const expCrud = crud({ key: v => MK('exp', ymOf(v.date)), fields: F_EXP, title: '経費', defaults: { account: '消耗品費', tax: 10, pay: '振込/口座' }, afterSave: () => { S.cache = {}; } });
const bizAmt = e => Math.round(num(e.amount) * ((e.ratio === '' || e.ratio == null) ? 1 : num(e.ratio) / 100));
A.expAdd = () => expCrud.add({ date: today() });
A.expEdit = el => { if (el.dataset.src === 'cash') cashCrud.edit(Store.get(MK('cash', S.month), el.dataset.id)); else expCrud.edit(Store.get(MK('exp', S.month), el.dataset.id)); };
function expLines(ym, src) {
  src = src || { exp: L('exp', ym), cash: L('cash', ym) };
  return [...src.exp.map(e => ({ ...e, src: 'exp', biz: bizAmt(e) })), ...src.cash.filter(c => c.kind !== '入金').map(c => ({ ...c, payee: c.desc, pay: '小口現金', src: 'cash', biz: num(c.amount) }))].sort(byDate);
}
P.exp = {
  month: true,
  keys: () => [MK('exp', S.month), MK('cash', S.month)],
  render() {

    ${list.length ? `<div class="tw"><table class="tbl"><thead><tr><th>日付</th><th>支払先・摘要</th><th>勘定科目</th><th class="n">金額</th><th class="n">事業分</th><th>税率</th><th>支払方法</th><th>インボイス</th><th></th></tr></thead><tbody>${list.map(e => `<tr class="click" data-act="expEdit" data-src="${esc(e.src)}" data-id="${esc(e.id)}"><td>${dLabel(e.date)}</td><td class="wrap">${esc(e.payee || '')}${e.note ? ` <span class="small muted">${esc(e.note)}</span>` : ''}${e.src === 'cash' ? ' <span class="pill">小口から</span>' : ''}</td><td>${esc(e.account || '')}</td><td class="n">${yen(e.amount)}</td><td class="n">${yen(e.biz)}</td><td>${esc(TAXLABEL[num(e.tax)] || '')}</td><td>${esc(e.pay || '')}</td><td>${e.invoice ? '<span class="pill ok">あり</span>' : ''}</td><td>${receiptLink(e)}</td></tr>`).join('')}</tbody></table></div>
    <section class="sec" style="margin-top:22px"><h3>勘定科目別</h3><div class="tw"><table class="tbl"><thead><tr><th>勘定科目</th><th class="n">件数</th><th class="n">事業分合計</th></tr></thead><tbody>${Object.keys(byA).map(k => `<tr><td>${esc(k)}</td><td class="n">${byA[k].length}</td><td class="n">${yen(sum(byA[k], e => e.biz))}</td></tr>`).join('')}</tbody></table></div></section>`
        : emptyBox(ymLabel(S.month) + 'の経費はまだありません', '家賃・水道光熱費・通信費・消耗品など、仕入以外の支払を記帳します', '<button class="btn primary" data-act="expAdd">＋ 経費を記帳</button>')}
    <p class="hint">仕入（食材・酒類）は「仕入帳」へ。小口現金出納帳の出金もここに合算して表示しています。</p>`;
  }
};
A.expCSV = () => { const list = expLines(S.month); saveFile(`経費帳_${S.month}.csv`, toCSV([['日付', '支払先・摘要', '勘定科目', '金額(税込)', '事業分', '税率', '支払方法', '適格請求書', 'メモ'], ...list.map(e => [e.date, e.payee, e.account, num(e.amount), e.biz, TAXLABEL[num(e.tax)] || '', e.pay, e.invoice ? '○' : '', e.note || ''])])); };

    </section>
    <section class="sec"><h3>買掛金（未払いの仕入・過去6か月）</h3>
      ${unpaid.length ? Object.keys(bySup).map(sid => `<div class="card" style="margin-bottom:12px"><h3>${esc(supName(sid))}<span class="pill warn">${yen(sum(bySup[sid], p => num(p.a8) + num(p.a10)))}</span><span class="sp"></span><span class="small muted">${esc([(Store.get('suppliers', sid) || {}).close, (Store.get('suppliers', sid) || {}).payDay].filter(Boolean).join(' → '))}</span><button class="btn sm primary" data-act="apPayAll" data-s="${esc(sid)}">まとめて支払済にする</button></h3>
        <div class="tw"><table class="tbl"><tbody>${bySup[sid].map(p => `<tr><td>${dLabel(p.date)}</td><td class="wrap small">${esc(p.desc || '')}</td><td class="n">${yen(num(p.a8) + num(p.a10))}</td><td>${p.checked ? '<span class="pill ok">照合済</span>' : '<span class="pill">未照合</span>'}</td><td><button class="btn sm" data-act="apPay" data-id="${esc(p.id)}" data-ym="${esc(p.ym)}">支払済</button></td></tr>`).join('')}</tbody></table></div></div>`).join('') : emptyBox('未払いの買掛金はありません', '')}
    </section>`;
  }
};
A.apPay = async el => { const p = Store.get(MK('purch', el.dataset.ym), el.dataset.id); if (!p) return; await Store.put(MK('purch', el.dataset.ym), p.id, { ...p, paid: today() }); toast('支払済にしました'); };

      add('売上高', i, t);

      const L2 = []; if (num(p.a8)) L2.push({ d: '仕入高', dv: num(p.a8), dt: TAXCLS.p8 }); if (num(p.a10)) L2.push({ d: '仕入高', dv: num(p.a10), dt: TAXCLS.p10 });

      if (EXP_ACCOUNTS.includes(c.account) || c.account === '仕入高') add(c.account, i, amt);

}
function syncToday(force) { // 開きっぱなしで日付が変わったとき・画面を移動したとき
  const td = today();
  if (S.lastToday !== td) { S.lastToday = td; S.month = curYM(); S.year = Number(td.slice(0, 4)); S.day = td; regiDraft = null; S.cache = {}; return true; }
  if (force) S.day = td;
  return false;
}
function nav(page) {
  if (!P[page]) return;
  syncToday(true);
  S.page = page; lsSet('rk.page', page); regiDraft = null; menuDraft = null; S.cache = {};
  $('#app').classList.remove('open'); pruneSubs(); render(); window.scrollTo(0, 0);
}
A.toggleNav = () => $('#app').classList.toggle('open');
A.mon = el => { S.month = addMonth(S.month, Number(el.dataset.n)); S.cache = {}; pruneSubs(); render(); };
A.year = el => { S.year += Number(el.dataset.n); S.cache = {}; render(); };
A.day = el => { const n = Number(el.dataset.n); S.day = n === 0 ? today() : addDay(S.day, n); regiDraft = null; pruneSubs(); render(); };
CHG.day = el => { if (el.value) { S.day = el.value; regiDraft = null; el.blur(); pruneSubs(); render(); } };
A.receipt = async el => {
  let url = el.dataset.url;
  if (!url.startsWith('sb:')) { toast('この証憑は開けません'); return; } // 自分の保存場所以外のURLは開かない
  try { url = await SB.signed(url.slice(3).replace(/[^A-Za-z0-9_.\/-]/g, '')); } catch (e) { toast('証憑を開けませんでした：' + e.message); return; } const isImg = /^image\//.test(el.dataset.type || '') || !/pdf/i.test(el.dataset.type || '');
  let v = $('#viewer'); if (!v) { v = document.createElement('div'); v.id = 'viewer'; document.body.appendChild(v); }
  v.innerHTML = `<div class="ov" style="z-index:70" data-act="viewerClose"><div class="modal wide"><header><h2>証憑</h2><button class="btn sm" data-act="viewerClose">閉じる</button></header><div style="padding:16px">${isImg ? `<img class="receipt-img" src="${esc(url)}" alt="証憑の画像">` : `<object data="${esc(url)}" type="application/pdf" style="width:100%;height:70vh"><a href="${esc(url)}" target="_blank" rel="noopener">PDFを開く</a></object>`}</div></div></div>`;
};
A.viewerClose = (el, e) => { if (e.target === el || el.tagName === 'BUTTON') $('#viewer').innerHTML = ''; };

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); nav(go.dataset.go); return; }
  if ($('#app').classList.contains('open') && !e.target.closest('.side') && !e.target.closest('[data-act="toggleNav"]')) { $('#app').classList.remove('open'); }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'ovclose') { if (e.target === a) closeModal(); return; }
  if (act === 'close') { closeModal(); return; }
  if (act === 'mdelete') { modalState && modalState.onDelete && modalState.onDelete(); return; }
  if (A[act]) { try { A[act](a, e); } catch (err) { console.error(err); toast('エラー：' + err.message); } }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && CHG[el.dataset.inp]) CHG[el.dataset.inp](el, e); });
document.addEventListener('submit', e => { if (e.target.id === 'mform') submitModal(e); });
document.addEventListener('focusout', () => { if (pendingRender) setTimeout(() => { if (pendingRender) render(); }, 30); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#viewer') && $('#viewer').innerHTML) $('#viewer').innerHTML = ''; else if (modalState) closeModal(); } });
setInterval(() => { if (!booted || modalState) return; if (syncToday(false)) { pruneSubs(); scheduleRender(); } else if (S.page === 'time' || S.page === 'home') scheduleRender(); }, 60000);

function loginScreen(msg = '', mode = 'login') {
  $('#side').innerHTML = ''; $('#side').hidden = true;
  $('#app').style.gridTemplateColumns = '1fr';
  $('#main').innerHTML = `<div style="max-width:420px;margin:10vh auto 0" class="card">
    <div class="brand" style="padding:0 0 14px;margin-bottom:14px"><span class="seal" aria-hidden="true">姫川</span><div><b>のどぐろ家姫川</b><small>${mode === 'login' ? 'ログイン' : '新規登録'}</small></div></div>
    ${msg ? `<div class="note-box ${/できません|違い|失敗|登録されていません/.test(msg) ? 'warn' : ''}">${esc(msg)}</div>` : ''}
    <form id="loginForm" class="grid" style="gap:12px">
      <label class="f"><span>メールアドレス</span><input id="lg_email" type="email" autocomplete="username" required value="${esc(lsGet('rk.lastEmail', ''))}"></label>
      <label class="f"><span>パスワード${mode === 'signup' ? '（8文字以上）' : ''}</span><input id="lg_pass" type="password" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}" required minlength="${mode === 'signup' ? 8 : 1}"></label>
      <button class="btn primary big" type="submit">${mode === 'login' ? 'ログイン' : '登録する'}</button>
      <button class="btn" type="button" id="lg_switch">${mode === 'login' ? 'はじめての方：新規登録' : 'ログイン画面に戻る'}</button>
    </form></div>`;
  $('#lg_switch').onclick = () => loginScreen('', mode === 'login' ? 'signup' : 'login');
  $('#loginForm').onsubmit = async ev => {
    ev.preventDefault(); const email = $('#lg_email').value.trim(), pass = $('#lg_pass').value; lsSet('rk.lastEmail', email);
    const btn = $('#loginForm button[type=submit]'); btn.disabled = true;
    try {
      if (mode === 'signup') { const j = await SB.signup(email, pass); if (!j.access_token) { loginScreen('確認メールを送りました。メール内のリンクを押してから、ここでログインしてください（リンク先のページが開けなくても確認は完了しています）。'); return; } }
      else await SB.login(email, pass);
      start();
    } catch (e) {
      btn.disabled = false;
      const m = /Invalid login/i.test(e.message) ? 'メールアドレスかパスワードが違います' : /not confirmed/i.test(e.message) ? 'メールの確認がまだです。届いたメールのリンクを押してください' : /already registered/i.test(e.message) ? 'このアドレスは登録済みです。ログインしてください' : 'できませんでした：' + e.message;
      loginScreen(m, mode);
    }
  };
}
async function start() {
  try {
    await SB.rpc('claim_owner');
    const ok = await SB.rpc('is_member');
    S.owner = !!(await SB.rpc('is_owner').catch(() => false));
    if (!ok) { const e = SB.email; SB.logout(); loginScreen(`${e} はメンバーに登録されていません。オーナーに「設定」画面で追加してもらってください。`); return; }
  } catch (e) { if (e.status === 401) { SB.logout(); loginScreen('もう一度ログインしてください'); return; } loginScreen('接続できませんでした：' + e.message); return; }
  $('#app').style.gridTemplateColumns = ''; $('#side').hidden = false;
  Store.onChange = scheduleRender;
  await Store.init();
  S.assets = { upload: f => SB.upload(f) };
  S.downloads = null;
  booted = true;
  BASE_KEYS.forEach(k => Store.ensure(k));
  render();
}
if (SB.sess) start(); else loginScreen();
</script>
</body></html>
